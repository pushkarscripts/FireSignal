<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <!-- Dark Obsidian Instrument Badge -->
  <rect width="32" height="32" rx="7.5" fill="#0B0E11" />
  <rect x="0.75" y="0.75" width="30.5" height="30.5" rx="6.75" fill="#13171C" stroke="#252D34" stroke-width="1.25" />

  <!-- Subtle Cardinal Reticle Ticks -->
  <line x1="16" y1="2" x2="16" y2="4.5" stroke="#252D34" stroke-width="1" stroke-linecap="round" />
  <line x1="16" y1="27.5" x2="16" y2="30" stroke="#252D34" stroke-width="1" stroke-linecap="round" />
  <line x1="2" y1="16" x2="4.5" y2="16" stroke="#252D34" stroke-width="1" stroke-linecap="round" />
  <line x1="27.5" y1="16" x2="30" y2="16" stroke="#252D34" stroke-width="1" stroke-linecap="round" />

  <!-- Orbital Satellite Trajectory Track -->
  <path d="M 5.5 22.5 C 4.5 15.5 10.5 7.5 19.5 7 C 22.5 6.8 25.5 8 26.5 10.5" stroke="#F0A34A" stroke-width="1.2" stroke-dasharray="2 2" opacity="0.7" stroke-linecap="round" />

  <!-- Satellite Optical Sensor Beacon -->
  <circle cx="19.5" cy="7" r="1.5" fill="#F0A34A" />
  <circle cx="19.5" cy="7" r="3.2" stroke="#F0A34A" stroke-width="0.75" opacity="0.45" />

  <!-- F Monogram (Structural Near-White #E8EDF0) -->
  <path d="M 8.5 7.5 L 8.5 24.5 M 8.5 7.5 L 16.5 7.5 M 8.5 14 L 14.5 14" stroke="#E8EDF0" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" />

  <!-- S Monogram (Amber Satellite Signal Wave #F0A34A) -->
  <path d="M 23 10 C 23 7.8 19.5 7.2 17 8.5 C 14.5 9.8 14 13.5 17.5 15 C 22 17 22.8 20.8 19.8 23 C 16.8 24.8 13.5 23.5 13 22" stroke="#F0A34A" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" />
</svg>
